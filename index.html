<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мій навчальний вебпроєкт — Практична робота №15</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    h1 {
      color: #1f2937;
      margin: 0;
      text-align: center;
    }

    section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    h2 {
      color: #374151;
      font-size: 20px;
      margin: 0;
    }

    /* Завдання 1: Вирівнювання блоків (ПР №14) */
    .container {
      width: 400px;
      height: 180px;
      background-color: lightblue;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 6px;
    }

    .box {
      width: 50px;
      height: 50px;
      background-color: coral;
      margin: 10px;
      font-size: 28px;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Завдання 2: Картка продукту */
    .card {
      width: 400px;
      background-color: #e8e8ea;
      padding: 30px;
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      border: 2px solid #03057c;
      box-sizing: border-box;
    }

    .card-text {
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      line-height: 1.3;
    }

    .card img {
      width: 200px;
      border: 2px solid #b0b0b2;
      margin-left: 30px;
      display: block;
      background-color: #ffffff;
    }
  </style>
</head>
<body>

  <h1>Практичні завдання з HTML та CSS</h1>

  <section>
    <h2>1. Картка продукту</h2>
    <div class="card">
      <div class="card-text">
        Помідор<br>
        Ціна - 47 грн
      </div>
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 200 200'><rect width='200' height='200' fill='%23ffffff'/><ellipse cx='100' cy='112' rx='66' ry='58' fill='%23e52521'/><ellipse cx='82' cy='92' rx='18' ry='10' transform='rotate(-25 82 92)' fill='%23ff7a75' opacity='0.65'/><path d='M100 56 C92 38 72 42 64 56 C78 56 88 60 95 66 C82 68 70 76 66 86 C80 80 92 74 100 70 C108 74 120 80 134 86 C130 76 118 68 105 66 C112 60 122 56 136 56 C128 42 108 38 100 56 Z' fill='%232e7d32'/><path d='M98 56 L102 32 L107 34 L103 56 Z' fill='%231b5e20'/></svg>" alt="Помідор">
    </div>
  </section>

  <section>
    <h2>2. Вирівнювання елементів по центру (Flexbox)</h2>
    <div class="container">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
    </div>
  </section>

</body>
</html>
